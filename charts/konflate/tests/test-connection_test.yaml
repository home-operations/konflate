suite: test-connection
templates:
  - tests/test-connection.tpl
set:
  config.repo: github://owner/repo
tests:
  - it: is a hardened helm test Pod that probes /readyz with the tag+digest-pinned curl
    asserts:
      - isKind:
          of: Pod
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: test
      - matchRegex:
          path: spec.containers[0].image
          pattern: curlimages/curl:.+@sha256:[0-9a-f]{64}$
      - equal:
          path: spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-konflate:8080/readyz

  - it: prefixes the test curl URL with basePath
    set:
      config.basePath: /platform/konflate
    asserts:
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-konflate:8080/platform/konflate/readyz

  - it: renders a templated basePath in the test curl URL
    set:
      config.basePath: '{{ printf "/platform/%s" "konflate" }}'
    asserts:
      - contains:
          path: spec.containers[0].args
          content: http://RELEASE-NAME-konflate:8080/platform/konflate/readyz
